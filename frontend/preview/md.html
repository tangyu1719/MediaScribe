<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Markdown 阅读</title>
  <style>
    :root{
      --bg:#ebe8e2;--bg2:#fff;--bg3:#f5f3ef;
      --surface:#fff;--surface2:#faf9f7;
      --border:rgba(15,23,42,.08);--border2:rgba(15,23,42,.05);
      --a1:#2563eb;--a-light:rgba(37,99,235,0.08);
      --t1:#1a1f2e;--t2:#5a6170;--t3:#949aa8;
      --ok:#16a34a;--err:#dc2626;--warn:#d97706;
      --mark:#f59e0b;
      --mark-red:#dc2626;
      --mark-red-bg:rgba(220,38,38,.08);
      --ff:'Inter','Microsoft YaHei','PingFang SC',-apple-system,sans-serif;
      --fm:'JetBrains Mono','SF Mono','Consolas',monospace;
      --r:22px;--r3:14px;
      --split-w:2px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family:var(--ff);color:var(--t1);
      background:radial-gradient(120% 80% at 10% 0%,#f3efe8 0%,var(--bg) 45%,#e4dfd6 100%);
      line-height:1.72;-webkit-font-smoothing:antialiased;
      display:flex;flex-direction:column;overflow:hidden;
    }
    .md-top{
      flex:0 0 auto;z-index:20;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:8px 16px;
      background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
      border-bottom:1px solid var(--border);
      box-shadow:0 4px 18px rgba(15,23,42,.04);
    }
    .md-brand{font-size:13px;font-weight:600;color:var(--t2)}
    .md-top-left{display:flex;align-items:flex-start;gap:10px;min-width:0;flex:1}
    .md-back-btn{flex-shrink:0;font-weight:600;color:var(--a1);border-color:rgba(37,99,235,.35);background:var(--a-light)}
    .md-back-btn:hover{background:rgba(37,99,235,.15)}
    .md-brand span{color:var(--a1)}
    .md-fname{
      font-family:var(--fm);font-size:14px;font-weight:600;color:var(--t1);
      max-width:min(62vw,560px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      margin-top:2px;
    }
    .md-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
    .md-seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--bg2)}
    .md-seg button,.md-btn{
      border:none;background:transparent;color:var(--t2);
      padding:5px 11px;font-size:12px;cursor:pointer;white-space:nowrap;
      transition:background .15s,color .15s;
    }
    .md-seg button:hover,.md-btn:hover{background:var(--bg3)}
    .md-seg button.active{background:var(--a1);color:#fff}
    .md-btn{border:1px solid var(--border);border-radius:999px;background:var(--bg2)}
    .md-btn-primary{background:var(--a1);color:#fff;border-color:transparent}
    .md-btn-primary:hover{background:#1d4ed8}
    .md-btn-warn{background:#fff7ed;color:#c2410c;border-color:#fed7aa}
    .md-btn:disabled{opacity:.45;cursor:not-allowed}
    .md-btn.is-saving{opacity:.7;cursor:wait}
    .md-btn.is-saved{background:var(--ok)!important;border-color:transparent!important;color:#fff!important}
    .md-btn-xs{padding:3px 8px;font-size:11px}
    .md-font-grp{
      display:inline-flex;align-items:center;gap:2px;
      border:1px solid var(--border);border-radius:999px;background:var(--bg2);
      padding:2px 4px 2px 8px;
    }
    .md-font-lbl{font-size:11px;color:var(--t3);margin-right:2px;user-select:none}
    .md-font-btn{
      min-width:28px;padding:4px 6px!important;font-size:13px!important;
      font-weight:600;line-height:1;border-radius:6px!important;
    }
    .md-font-val{
      min-width:26px;text-align:center;font-size:11px;font-family:var(--fm);
      color:var(--t2);user-select:none;
    }
    .md-main{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column}
    .md-status{padding:48px 20px;text-align:center;color:var(--t2);font-size:14px}
    .md-status.err{color:var(--err)}
    .md-work{
      flex:1;min-height:0;display:none;flex-direction:column;overflow:hidden;
      --md-render-fs:15px;--md-editor-fs:13px;
    }
    .md-work.show{display:flex}
    /* 三种视角互斥：同一时刻只显示一种 */
    .md-work.mode-reader .md-split,
    .md-work.mode-reader .md-markbar{display:none!important}
    .md-work.mode-reader .md-reader{display:block;flex:1;min-height:0;overflow:auto}
    .md-work.mode-source .md-reader{display:none!important}
    .md-work.mode-source .md-split{display:grid!important;flex:1;min-height:0;overflow:hidden}
    .md-work.mode-split .md-reader,
    .md-work.mode-html .md-reader,
    .md-work.mode-triple .md-reader,
    .md-work.mode-custom .md-reader{display:none!important}
    .md-work.mode-split .md-split,
    .md-work.mode-html .md-split,
    .md-work.mode-triple .md-split,
    .md-work.mode-custom .md-split,
    .md-work.mode-source .md-split{
      display:grid!important;flex:1;min-height:0;overflow:hidden;
      grid-template-rows:1fr!important;
    }
    .md-pane-picks{
      display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;
      padding:3px 8px;border:1px solid var(--border);border-radius:999px;background:var(--bg2);
      font-size:11px;color:var(--t2);
    }
    .md-pane-lbl{font-size:11px;font-weight:600;color:var(--t2);user-select:none;white-space:nowrap}
    .md-pick{display:inline-flex;align-items:center;gap:4px;cursor:pointer;user-select:none;white-space:nowrap}
    .md-pick input{width:13px;height:13px;margin:0;cursor:pointer}
    .md-pane-html .md-html-body{padding:0;background:#fff}
    .md-html-frame{width:100%;height:100%;min-height:320px;border:none;display:block;background:#fff}
    .md-html-empty{
      padding:32px 16px;text-align:center;color:var(--t3);font-size:13px;
    }
    .md-pane.is-hidden{display:none!important}
    .md-vdivider.is-hidden{display:none!important}
    /* 单栏阅读 */
    .md-reader{display:none;padding:24px 20px 48px;overflow-x:hidden;overflow-y:auto}
    .md-paper{
      max-width:920px;margin:0 auto;background:var(--surface);
      border:1px solid var(--border);border-radius:var(--r);
      box-shadow:0 1px 0 rgba(255,255,255,.75) inset,0 18px 48px rgba(15,23,42,.055);
      padding:36px 40px 44px;
    }
    /* 竖直分割线双栏：左渲染 | 右编辑 */
    .md-split{display:none;overflow:hidden}
    .md-vdivider{
      background:linear-gradient(180deg,#d4cfc4,#b8b2a6,#d4cfc4);
      min-height:0;cursor:col-resize;position:relative;z-index:5;
      transition:background .15s;
    }
    .md-vdivider:hover,.md-vdivider.dragging{background:var(--a1)}
    .md-vdivider::after{
      content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      width:4px;height:36px;border-radius:4px;background:rgba(255,255,255,.55);
    }
    .md-pane{min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--surface);overflow:hidden}
    .md-pane-hdr{
      flex:0 0 auto;padding:6px 12px;font-size:11px;font-weight:600;color:var(--t3);
      background:var(--surface2);border-bottom:1px solid var(--border2);
      display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;
    }
    .md-pane-fname{
      font-family:var(--fm);font-size:12px;font-weight:600;color:var(--t1);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:right;
    }
    .md-reader-hdr{
      max-width:920px;margin:0 auto 10px;padding:0 6px;
      font-family:var(--fm);font-size:13px;font-weight:600;color:var(--t1);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    .md-pane-body{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto}
    .md-render{
      font-size:var(--md-render-fs);color:var(--t1);
      line-height:1.65;
      word-break:break-word;overflow-wrap:break-word;
      padding:24px 28px 32px;max-width:100%;overflow-x:hidden;
    }
    .md-render > :first-child{margin-top:0}
    .md-render p:empty{display:none}
    .md-render li>p,.md-render li>ol,.md-render li>ul{margin:0}
    .md-render ul,.md-render ol{margin:.5em 0;padding-left:1.4em}
    .md-render li{margin:.2em 0;line-height:1.65}
    .md-render li::marker{font-size:.92em}
    .md-render mark.md-mark-hl-render,
    .md-render .md-mark-hl-render{
      color:inherit;border-radius:2px;padding:0;margin:0;
      background:rgba(254,202,202,.28);
      outline:2px solid var(--mark-red);
      outline-offset:-2px;
      box-decoration-break:clone;
      -webkit-box-decoration-break:clone;
    }
    .md-editor-wrap{flex:1;min-height:0;display:flex;overflow:hidden;background:#fffdf9}
    .md-source-pane-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
    .md-gutter{
      flex:0 0 32px;overflow:hidden;background:#faf8f5;
      border-right:1px solid var(--border2);font-family:var(--fm);
      font-size:calc(var(--md-editor-fs) - 2px);
      color:var(--t3);padding:14px 0;user-select:none;position:relative;
    }
    .md-gutter-inner{position:relative;will-change:transform;min-height:100%}
    .md-gutter-line{
      position:absolute;left:2px;right:2px;cursor:pointer;
      display:flex;align-items:flex-start;justify-content:center;padding-top:1px;
    }
    .md-gutter-line.marked{color:var(--mark-red);font-weight:700}
    .md-gutter-line.marked::before{content:"◆";font-size:10px;line-height:1}
    .md-gutter-line.active::after{
      content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
      background:var(--a1);border-radius:2px;
    }
    .md-editor-stack{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden;background:#fffdf9}
    .md-editor-measure{
      position:absolute;left:0;top:0;z-index:0;visibility:hidden;pointer-events:none;
      margin:0;border:none;overflow:hidden;box-sizing:border-box;
      font-family:var(--fm);font-size:var(--md-editor-fs);line-height:1.55;
      padding:14px 16px;white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word;
    }
    .md-editor-measure .md-measure-mirror{display:block;margin:0;white-space:inherit;word-break:inherit;overflow-wrap:inherit}
    .md-editor-measure .md-bl-text,.md-editor-backdrop-inner .md-bl-text{
      display:block;margin:0;padding:0;
      white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word;
    }
    .md-editor-measure .ml-probe{display:block;margin:0;white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word}
    .md-editor-backdrop{
      position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;
    }
    .md-editor-backdrop-inner{
      padding:14px 16px;box-sizing:border-box;min-height:100%;
      font-family:var(--fm);font-size:var(--md-editor-fs);line-height:1.55;
      white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word;
      color:var(--t1);will-change:transform;
    }
    .md-editor-backdrop-inner mark.md-mark-hl,
    .md-editor-backdrop-inner .md-bl-text .md-mark-hl{
      color:inherit;border-radius:2px;padding:0;margin:0;
      background:rgba(254,202,202,.28);
      outline:2px solid var(--mark-red);
      outline-offset:-2px;
      box-decoration-break:clone;
      -webkit-box-decoration-break:clone;
    }
    .md-editor-mark-overlay{display:none!important}
    .md-mark-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-start}
    .md-mark-chip{
      border:2px solid var(--mark-red);background:rgba(220,38,38,.08);
      border-radius:6px;padding:2px 10px;font-size:11px;font-family:var(--fm);
      color:var(--mark-red);cursor:pointer;max-width:300px;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    .md-mark-chip:hover{background:rgba(220,38,38,.16)}
    .md-mark-empty{color:var(--t3);font-size:11px}
    .md-sel-status{margin-left:auto;font-family:var(--fm);font-size:11px;color:var(--t2);white-space:nowrap}
    .md-mark-float{
      position:fixed;right:16px;bottom:16px;z-index:90;
      width:min(440px,calc(100vw - 32px));
      max-height:min(56vh,440px);
      display:flex;flex-direction:column;
      background:#fffbeb;border:1px solid #fde68a;border-radius:12px;
      box-shadow:0 10px 36px rgba(15,23,42,.14);
      overflow:hidden;transition:box-shadow .2s,max-height .2s ease;
    }
    .md-mark-float[hidden]{display:none!important}
    .md-mark-float.is-collapsed{
      max-height:none;width:auto;min-width:168px;
      box-shadow:0 4px 16px rgba(15,23,42,.1);
    }
    .md-mark-float.is-collapsed .md-mark-float-body{display:none}
    .md-mark-float-hdr{
      display:flex;align-items:center;justify-content:space-between;gap:8px;
      padding:7px 10px;font-size:12px;font-weight:600;color:#92400e;
      background:#fef3c7;border-bottom:1px solid #fde68a;flex:0 0 auto;cursor:pointer;
    }
    .md-mark-float.is-collapsed .md-mark-float-hdr{border-bottom:none;border-radius:12px}
    .md-mark-float-title{white-space:nowrap}
    .md-mark-float-sub{font-weight:400;font-size:10px;color:#b45309;opacity:.9}
    .md-mark-float-nav{display:flex;align-items:center;gap:4px;flex:0 0 auto}
    .md-mark-float-nav .md-btn{padding:2px 8px;font-size:11px;min-width:auto;line-height:1.3}
    .md-mark-float-toggle{
      flex:0 0 auto;border:1px solid #fcd34d;background:#fff;
      color:#92400e;width:26px;height:26px;border-radius:6px;cursor:pointer;
      font-size:14px;line-height:1;padding:0;
    }
    .md-mark-float-toggle:hover{background:#fff7ed}
    .md-mark-float-body{overflow:auto;flex:1;min-height:0;display:flex;flex-direction:column}
    .md-mark-float-summary-pre{
      margin:0;padding:10px 12px 8px;font-family:var(--fm);font-size:11px;line-height:1.55;
      white-space:pre-wrap;word-break:break-word;color:var(--t2);flex:0 0 auto;
    }
    .md-mark-float-summary-pre.is-empty{color:var(--t3);font-style:italic}
    .md-mark-float-chips-hdr{
      padding:4px 12px 0;font-size:10px;font-weight:600;color:#b45309;
      border-top:1px dashed #fde68a;flex:0 0 auto;
    }
    .md-mark-float .md-mark-list{padding:6px 10px 10px;flex:0 0 auto}
    .md-editor{
      position:relative;z-index:2;
      flex:1;min-width:0;width:100%;height:100%;border:none;outline:none;resize:none;
      box-sizing:border-box;
      font-family:var(--fm);font-size:var(--md-editor-fs);line-height:1.55;
      padding:14px 16px;background:transparent!important;
      color:transparent!important;caret-color:var(--t1);
      -webkit-text-fill-color:transparent!important;text-shadow:none!important;
      white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word;
      overflow-x:hidden;overflow-y:auto;
      scrollbar-gutter:stable;
    }
    .md-editor::selection,.md-editor::-moz-selection{
      background:transparent!important;color:transparent!important;-webkit-text-fill-color:transparent!important;
    }
    .md-markbar{
      flex:0 0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
      padding:6px 12px;font-size:11px;color:var(--t2);
      background:#fffbeb;border-bottom:1px solid #fde68a;
    }
    .md-markbar kbd{font-family:var(--fm);font-size:10px;padding:1px 5px;border-radius:4px;border:1px solid var(--border);background:#fff}
    .md-toast{
      position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
      background:rgba(26,31,46,.92);color:#fff;padding:8px 16px;border-radius:999px;
      font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99;
      max-width:min(92vw,640px);text-align:center;white-space:pre-wrap;
    }
    .md-toast.show{opacity:1}
    .md-toast.ok{background:rgba(22,163,74,.94)}
    .md-toast.err{background:rgba(220,38,38,.94)}
    .md-modal{
      position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
      background:rgba(15,23,42,.45);padding:16px;
    }
    .md-modal[hidden]{display:none!important}
    .md-modal-box{
      width:min(520px,96vw);max-height:88vh;overflow:hidden;display:flex;flex-direction:column;
      background:var(--surface);border:1px solid var(--border);border-radius:var(--r3);
      box-shadow:0 24px 64px rgba(15,23,42,.18);
    }
    .md-modal-hdr{padding:14px 16px 8px;font-size:15px;font-weight:700;color:var(--t1)}
    .md-modal-body{padding:0 16px 12px;display:flex;flex-direction:column;gap:10px;min-height:0}
    .md-modal-lbl{font-size:12px;color:var(--t2);display:flex;flex-direction:column;gap:4px}
    .md-modal-lbl input{
      font-family:var(--fm);font-size:13px;padding:8px 10px;border:1px solid var(--border);
      border-radius:8px;background:var(--bg2);
    }
    .md-modal-dir{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--bg2);display:flex;flex-direction:column;min-height:0}
    .md-modal-dir-hdr{
      display:flex;align-items:center;justify-content:space-between;gap:8px;
      padding:8px 10px;border-bottom:1px solid var(--border2);font-size:12px;color:var(--t2);
    }
    .md-modal-dir-path{
      padding:6px 10px;font-size:11px;font-family:var(--fm);color:var(--t3);
      border-bottom:1px solid var(--border2);word-break:break-all;line-height:1.4;
    }
    .md-modal-dir-list{max-height:220px;overflow:auto;padding:4px}
    .md-modal-dir-item{
      display:block;width:100%;text-align:left;border:none;background:transparent;
      padding:7px 10px;font-size:12px;color:var(--t1);cursor:pointer;border-radius:6px;
    }
    .md-modal-dir-item:hover{background:var(--a-light)}
    .md-modal-dir-item.sel{background:rgba(37,99,235,.12);color:var(--a1);font-weight:600}
    .md-modal-actions{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px 14px;border-top:1px solid var(--border2)}
    .md-render h1,.md-render h2,.md-render h3,.md-render h4{color:var(--t1);line-height:1.35;margin:1.35em 0 .65em;font-weight:700}
    .md-render h1{font-size:1.75em;border-bottom:2px solid var(--border2);padding-bottom:.35em}
    .md-render h2{font-size:1.35em;border-left:4px solid var(--a1);padding-left:.65em}
    .md-render h3{font-size:1.12em;color:var(--t2)}
    .md-render .md-heading-anchor{
      cursor:pointer;scroll-margin-top:72px;position:relative;
      transition:color .15s, background .15s;
      border-radius:6px;padding-left:.15em;margin-left:-.15em;
    }
    .md-render .md-heading-anchor:hover{color:var(--a1)}
    .md-render .md-heading-link-icon{
      display:inline-block;margin-right:.35em;font-size:.72em;font-weight:600;
      color:var(--t3);opacity:0;transition:opacity .15s,color .15s;
      vertical-align:middle;font-family:var(--fm);
    }
    .md-render .md-heading-anchor:hover .md-heading-link-icon,
    .md-render .md-heading-anchor:focus .md-heading-link-icon{opacity:1;color:var(--a1)}
    .md-render .md-heading-flash{
      animation:mdHeadingFlash 1.2s ease;
    }
    @keyframes mdHeadingFlash{
      0%,100%{background:transparent}
      18%{background:rgba(37,99,235,.14)}
      55%{background:rgba(37,99,235,.06)}
    }
    /* 智能浮动章节目录 — 液态玻璃 */
    .md-smart-toc{
      position:fixed;left:16px;top:72px;z-index:950;
      width:200px;height:260px;min-width:160px;min-height:140px;
      max-width:min(42vw,360px);max-height:min(62vh,480px);
      display:flex;flex-direction:column;
      background:rgba(255,255,255,.38);
      backdrop-filter:blur(20px) saturate(1.45);
      -webkit-backdrop-filter:blur(20px) saturate(1.45);
      border:1px solid rgba(255,255,255,.58);
      border-radius:16px;
      box-shadow:0 10px 40px rgba(15,23,42,.11), inset 0 1px 0 rgba(255,255,255,.72);
      overflow:hidden;opacity:.88;
      transition:opacity .2s, box-shadow .2s, width .15s, height .15s;
    }
    .md-smart-toc:hover{opacity:.96;box-shadow:0 14px 48px rgba(15,23,42,.14), inset 0 1px 0 rgba(255,255,255,.78)}
    .md-smart-toc.is-collapsed{width:auto!important;height:auto!important;min-width:132px;min-height:0;max-height:none}
    .md-smart-toc.is-collapsed .md-smart-toc-body{display:none}
    .md-smart-toc-hdr{
      display:flex;align-items:center;justify-content:space-between;gap:6px;
      padding:7px 9px;font-size:11px;font-weight:700;color:var(--t2);

<body>
  <header class="md-top">
    <div class="md-top-left">

      </div>

        <label class="md-pick"><input type="checkbox" data-pane="html"> HTML</label>

        <span class="md-font-val" id="renderFsVal">15</span>
        <button type="button" class="md-btn md-font-btn" id="renderFsUp" aria-label="放大左侧字号">A+</button>
      </div>
      <div class="md-font-grp" title="右侧原文编辑字号">
        <span class="md-font-lbl">右</span>
        <button type="button" class="md-btn md-font-btn" id="editorFsDown" aria-label="缩小右侧字号">A−</button>
        <span class="md-font-val" id="editorFsVal">13</span>
        <button type="button" class="md-btn md-font-btn" id="editorFsUp" aria-label="放大右侧字号">A+</button>
      </div>
      <button type="button" class="md-btn" id="markSelBtn" title="标记当前选中文字">标记选区</button>
      <button type="button" class="md-btn" id="openLocalBtn">本机打开</button>
      <button type="button" class="md-btn" id="copyPathBtn">复制路径</button>
      <button type="button" class="md-btn md-btn-primary" id="saveBtn">保存</button>
      <button type="button" class="md-btn md-btn-warn" id="saveAsBtn" title="另存到本机任意文件夹（系统对话框）">另存为</button>
    </div>
  </header>
  <main class="md-main">
    <div class="md-status" id="status">加载中…</div>

            <div class="md-render" id="renderSplit"></div>

        <div class="md-mark-float-chips-hdr">快速跳转</div>
        <div class="md-mark-list" id="markList"></div>
      </div>
    </div>

    var GENERIC_H1_RE=/^#\s*(小红书|抖音|B站)(图文|视频)?分析\s*$/;

      if(m)return m[1].replace(/_/g," ");

    function ensureMarked(){
      if(typeof marked==="undefined")throw new Error("Markdown 渲染库未加载，请刷新或检查 /vendor/marked.min.js");

    function normalizeMdSource(raw){

      return String(raw||"").replace(/\r\n/g,"\n").replace(/\u200b|\uFEFF/g,"").replace(/\uFF03/g,"#").replace(/^[ \t\u3000]+(#{1,6}\s)/gm,"$1").replace(/^(#{1,6})([^\s#\n])/gm,"$1 $2");
    }
    function renderMarkdown(raw,targetEl){
      ensureMarked();
      var html="";

      if(!html){
        try{html=marked.parse(normalizeMdSource(raw));}

        window.SBA_RICH_CONTENT.scheduleMermaidHydrate(targetEl);

    function collectRenderTextNodes(root){
      var nodes=[];
      if(!root)return nodes;
      var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);
      var n;
      while((n=walker.nextNode())){
        if(n.parentElement&&n.parentElement.closest("mark.md-mark-hl-render"))continue;
        nodes.push(n);
      }
      return nodes;
    }
    function markdownStripLite(text){
      return String(text||"")
        .replace(/\*\*(.+?)\*\*/g,"$1").replace(/__(.+?)__/g,"$1")
        .replace(/`([^`]+)`/g,"$1").replace(/\[(.+?)\]\([^)]+\)/g,"$1");
    }
    function wrapRenderTextNodes(nodes,gStart,gEnd){
      var pos=0;
      for(var i=0;i<nodes.length;i++){
        var node=nodes[i];
        if(!node||!node.parentNode)continue;
        var val=node.nodeValue||"";
        var len=val.length;
        var ns=pos,ne=pos+len;
        if(ne<=gStart||ns>=gEnd){pos=ne;continue;}
        var localStart=Math.max(0,gStart-ns);
        var localEnd=Math.min(len,gEnd-ns);
        if(localStart>0){
          node=node.splitText(localStart);
          localEnd-=localStart;
        }
        if(localEnd<node.nodeValue.length)node.splitText(localEnd);
        var mark=document.createElement("mark");
        mark.className="md-mark-hl-render";
        node.parentNode.insertBefore(mark,node);
        mark.appendChild(node);
        pos=ne;
      }
    }
    function findSnippetInRenderNodes(nodes,snippet){
      if(!snippet)return null;
      var full=nodes.map(function(n){return n.nodeValue||"";}).join("");
      var tries=[snippet,markdownStripLite(snippet),snippet.replace(/\s+/g," ").trim()];
      for(var ti=0;ti<tries.length;ti++){
        var needle=tries[ti];
        if(!needle)continue;
        var idx=full.indexOf(needle);
        if(idx>=0)return{start:idx,end:idx+needle.length};
      }
      return null;
    }
    function highlightSnippetInRenderEl(root,snippet,allowLineFallback){
      if(!root||!snippet)return false;
      var nodes=collectRenderTextNodes(root);
      if(!nodes.length)return false;
      var hit=findSnippetInRenderNodes(nodes,snippet);
      if(hit){
        wrapRenderTextNodes(nodes,hit.start,hit.end);
        return true;
      }
      if(allowLineFallback===false||snippet.indexOf("\n")<0)return false;
      var hitAny=false;
      snippet.split("\n").forEach(function(line){
        var t=line.trim();
        if(!t)return;
        if(highlightSnippetInRenderEl(root,t,false))hitAny=true;
      });
      return hitAny;
    }
    function applyMarksToRenderEl(root,sourceText,marks){
      if(!root||!marks||!marks.length)return;
      marks.slice().sort(function(a,b){return b.start-a.start;}).forEach(function(m){
        var s=Number(m.start),e=Number(m.end);
        if(!(e>s))return;
        var snippet=(sourceText||"").slice(s,e);
        if(!snippet)return;
        highlightSnippetInRenderEl(root,snippet);
      });
    }
    function bindInnerLinks(root){

        if(!/\.(md|txt|markdown|mdx)$/i.test(name))return;
        ev.preventDefault();
        if(state.dirty&&!confirm("有未保存修改，确定打开 "+name+"？"))return;

    function companionHtmlCandidates(mdFile){
      var base=String(mdFile||"");
      var stem=base.replace(/\.(md|markdown|mdx|txt)$/i,"");
      var list=[];
      if(stem)list.push(stem+".longpage.html");
      if(stem)list.push(stem+".html");
      return list.filter(function(x,i,a){return a.indexOf(x)===i;});

    function checkHtmlAvailable(){
      var cands=companionHtmlCandidates(state.file);
      if(!cands.length){state.htmlAvailable=false;state.htmlFile="";return Promise.resolve(false);}
      var tryOne=function(i){
        if(i>=cands.length){state.htmlAvailable=false;state.htmlFile="";return Promise.resolve(false);}
        var name=cands[i];
        return fetchWithTimeout("/output/"+encodeURIComponent(name),{method:"HEAD"},HTML_HEAD_MS).then(function(r){
          if(r.ok){state.htmlAvailable=true;state.htmlFile=name;return true;}
          return tryOne(i+1);
        }).catch(function(){return tryOne(i+1);});
      };
      return tryOne(0);
    }

    function applyCanvasGrid(){

    function applyPreset(preset){

    function normEOL(t){return String(t||"").replace(/\r\n/g,"\n").replace(/\r/g,"\n");}
    /** 与后端 output_file_io.find_summary_start 一致：定位文末 ColorMarker 汇总块 */
    function findSummaryStart(text){
      var lines=normEOL(text).split("\n");
      for(var i=lines.length-1;i>=0;i--){
        if(lines[i].trim()!=="标记内容汇总")continue;
        if(i>0){
          var prev=lines[i-1].trim();
          if(prev.length>=10&&/^=+$/.test(prev)){
            var startPos=0;
            for(var j=0;j<i-1;j++)startPos+=lines[j].length+1;
            return startPos;
          }
        }
      }
      return-1;
    }
    /** 静态直链返回全文时，剥离文末「标记内容汇总」块，避免正文与 offset 错位 */
    function stripEmbeddedMarksFromRaw(raw){
      raw=normEOL(raw||"");
      var start=findSummaryStart(raw);
      if(start<0)return{body:raw,footer:"",hasFooter:false};
      var body=raw.slice(0,start).replace(/\n+$/,"");
      if(body)body+="\n";
      return{body:body,footer:raw.slice(start),hasFooter:true};
    }
    var ST3_SUMMARY_LINE="==================================================";
    function normalizeTextSt3(text){
      return normEOL(text||"").replace(/\u00a0/g," ").replace(/\u3000/g," ")

    }
    function markdownStripForSearch(text){
      return String(text||"")
        .replace(/\*\*(.+?)\*\*/g,"$1").replace(/__(.+?)__/g,"$1")
        .replace(/`([^`]+)`/g,"$1").replace(/\[(.+?)\]\([^)]+\)/g,"$1");
    }
    function searchNeedles(item){
      var needles=[];
      [item,item.trim(),markdownStripForSearch(item),markdownStripForSearch(item).trim(),item.split(/\s+/).join(" ")].forEach(function(cand){
        if(cand&&needles.indexOf(cand)<0)needles.push(cand);
      });
      return needles;
    }
    function encodeFooterItemText(text){
      return String(text||"").replace(/\\/g,"\\\\").replace(/\r/g,"").replace(/\n/g,"\\n");

    function decodeFooterItemText(text){
      var out="",src=String(text||""),i=0;
      while(i<src.length){
        if(src[i]==="\\"&&i+1<src.length){
          if(src[i+1]==="n"){out+="\n";i+=2;continue;}
          if(src[i+1]==="\\"){out+="\\";i+=2;continue;}
        }
        out+=src[i];i++;
      }
      return out;
    }
    function parseSummaryItems(summaryText){
      var items=[],meta={count:null,order_fp:""};
      normEOL(summaryText||"").split("\n").forEach(function(line){
        var s=line.trim();
        if(!s)return;
        if(s.indexOf("COUNT:")===0){
          var cv=parseInt(s.split(":")[1],10);
          meta.count=isNaN(cv)?null:cv;
          return;
        }
        if(s.indexOf("ORDER_FP:")===0){
          meta.order_fp=s.split(":").slice(1).join(":").trim();
          return;
        }
        var dot=s.indexOf(". ");
        if(dot<=0||!/^\d+$/.test(s.slice(0,dot)))return;

    function findNameSpanInLine(line,name,text){

      var idx=lineText.indexOf(name);

      var compact=function(s){return s.replace(/\s+/g,"");};
      var cLine=compact(lineText),cName=compact(name);
      idx=cLine.indexOf(cName);
      if(idx>=0){
        var oi=0,ci=0,matchStart=-1;
        while(ci<lineText.length){

          var actual=text.slice(start,end);
          if(!actual)return;
          if(!name)name=actual.replace(/\s+/g," ").trim().slice(0,120);
        }else{

      while(oldEnd>start&&newEnd>start&&oldText[oldEnd-1]===newText[newEnd-1]){oldEnd--;newEnd--;}
      return{

        removed:oldEnd-start,inserted:newEnd-start

    function findSnippetNear(text,snip,hint){
      snip=String(snip||"");

      hint=Math.max(0,Math.min(hint|0,text.length));
      if(text.slice(hint,hint+snip.length)===snip)return hint;
      var maxD=Math.max(hint,text.length-hint)+snip.length;
      for(var d=1;d<=maxD;d++){

        if(a>=0&&text.slice(a,a+snip.length)===snip)return a;
        var b=hint+d;

      }
      return-1;

      if(newSnip&&(!oldSnip||newSnip!==oldSnip)){
        if(!name||newSnip===name||newSnip.indexOf(name)>=0)oldSnip=newSnip;
      }
      if(!oldSnip&&name){
        var p=findSnippetNear(newText,name,start);
        if(p<0)p=findSnippetNear(oldText,name,start);
        if(p>=0)oldSnip=markSnippetAt(newText,p,p+name.length)||markSnippetAt(oldText,p,p+name.length);

      hint=Math.max(0,Math.min(hint|0,newText.length));
      var pos=findSnippetNear(newText,oldSnip,hint);
      if(pos<0&&name)pos=findSnippetNear(newText,name,hint);
      if(pos>=0){
        if(newText.slice(pos,pos+oldSnip.length)===oldSnip)return{start:pos,end:pos+oldSnip.length};
        if(name&&newText.slice(pos,pos+name.length)===name)return{start:pos,end:pos+name.length};

    function adjustMarksForTextEdit(oldText,newText,marks){

      normalizeMarkList(marks,oldText).forEach(function(m){
        var start=Number(m.start),end=Number(m.end);
        var name=String(m.name||"").trim();
        var oldSnip=resolveOldSnip(oldText,newText,start,end,name);
        if(!oldSnip)return;
        var anchored=null;
        if(end<=edit.start){
          anchored=reanchorMarkRange(newText,oldSnip,name,start,start,end);
        }else if(start>=edit.oldEnd){
          anchored=reanchorMarkRange(newText,oldSnip,name,start+delta,start+delta,end+delta);
        }else{
          var hint=start>=edit.oldEnd?start+delta:edit.start;
          anchored=reanchorMarkRange(newText,oldSnip,name,hint,start,end);

        if(!anchored)return;
        var ns=anchored.start,ne=anchored.end;

    function fetchWithTimeout(url,opts,ms){
      ms=ms||FILE_FETCH_MS;
      if(typeof AbortController==="undefined")return fetch(url,opts||{});
      var ctrl=new AbortController();

      return fetch(url,Object.assign({},opts||{},{signal:ctrl.signal})).finally(function(){clearTimeout(timer);});
    }
    function fetchStaticOutputFile(name){

    function fetchApiOutputFile(name,withMarks){

      if(withMarks===false)qs+="&marks=false";
      return fetchWithTimeout(qs,{},FILE_FETCH_MS).then(function(r){
        return r.json().then(function(d){

    /** 首屏优先静态直链（最快），后台再拉 API 补全 marks/path；API 极快时直接用 API */
    function fetchOutputFileFromDisk(name){
      var settled=false;
      var apiP=fetchApiOutputFile(name,true);
      var staticP=fetchStaticOutputFile(name);
      return new Promise(function(resolve,reject){
        var timer=setTimeout(function(){
          if(settled)return;
          staticP.then(function(d){
            if(settled)return;
            settled=true;
            resolve(d);
          }).catch(function(){
            if(settled)return;
            settled=true;
            reject(new Error("加载超时，请确认后端已启动（http://127.0.0.1:8000）"));
          });
        },API_FAST_MS);
        staticP.then(function(d){
          if(settled)return;
          settled=true;
          clearTimeout(timer);
          resolve(d);
        }).catch(function(){});
        apiP.then(function(d){
          if(settled)return;
          settled=true;
          clearTimeout(timer);
          resolve(d);
        }).catch(function(){
          if(settled)return;
          staticP.then(function(sd){
            if(settled)return;
            settled=true;
            clearTimeout(timer);
            resolve(sd);
          }).catch(function(e){
            if(settled)return;
            settled=true;
            clearTimeout(timer);
            reject(e);
          });
        });
      });
    }

      state.absPath=d.path||state.absPath||"";
      state.outputDir=d.output_dir||state.outputDir||"";
      if(d.mtime!=null){
        var mv=parseInt(d.mtime,10);

          state.docVersion=mv;

      state.marksFooter=d.marks_footer||embeddedFooter||"";

    function buildLayeredHtml(text,ranges){
      text=normEOL(text||"");
      if(!text)return"";
      if(!ranges||!ranges.length)return escHtml(text);
      var bounds=[0,text.length];
      ranges.forEach(function(r){
        var s=Math.max(0,Math.min(r.start|0,text.length));
        var e=Math.max(0,Math.min(r.end|0,text.length));
        if(e<=s)return;
        bounds.push(s,e);
      });
      bounds=Array.from(new Set(bounds)).sort(function(a,b){return a-b;});
      var html="";
      for(var i=0;i<bounds.length-1;i++){
        var a=bounds[i],b=bounds[i+1];
        if(b<=a)continue;
        var cls=[];
        ranges.forEach(function(r){
          var s=Math.max(0,Math.min(r.start|0,text.length));
          var e=Math.max(0,Math.min(r.end|0,text.length));
          if(s<=a&&e>=b)cls.push(r.cls);
        });
        var chunk=escHtml(text.slice(a,b));
        if(!cls.length)html+=chunk;
        else html+='<span class="'+cls.join(" ")+'">'+chunk+"</span>";
      }
      return html;
    }

        var cur=editor.selectionStart||0;

        var hub=window.SBA_READER_HUB;
        if(!hub||!state.file)return;
        hub.registerOpenedFile(state.file);
      }catch(_){}
    }
    function initMdAgentPanel(){
      if(typeof window.SBA_INIT_READER_AGENT!=="function")return;
      mdAgentApi=window.SBA_INIT_READER_AGENT({
        getMeta:function(){return{name:state.file||"",text:state.text||"",version:state.docVersion||0,local_revision:state.dirty?Math.max(1,state.localRevision||1):0};},
        prepareMeta:prepareDocMetaForAgent,
        onDocSynced:onAgentDocSynced,
        toast:toast
      });
    }
    function initMdSmartToc(){
      if(typeof window.SBA_INIT_READER_SMART_TOC!=="function")return;
      mdSmartTocApi=window.SBA_INIT_READER_SMART_TOC({
        getMeta:function(){return{name:state.file||"",text:state.text||"",version:state.docVersion||0,local_revision:state.dirty?Math.max(1,state.localRevision||1):0};},
        getMode:function(){return state.mode;},
        getRenderEls:function(){
          return{reader:renderReader,split:renderSplit,readerPane:readerPane,renderPane:renderPane};
        },
        onRepaint:function(fn){mdTocRepaintHook=fn;}
      });
    }
    function paintDocumentUi(){
      try{
        var initPreset=(params.get("preset")||params.get("view")||"reader").toLowerCase();
        var allowed=["reader","source","split","html","triple"];
        applyPreset(allowed.indexOf(initPreset)>=0?initPreset:"reader");
      }catch(e){
        statusEl.hidden=false;
        statusEl.textContent=e.message||String(e);
        statusEl.classList.add("err");
      }
    }
    function afterDocumentLoaded(opts){
      opts=opts||{};
      statusEl.hidden=true;
      workEl.classList.add("show");
      workEl.classList.add("mode-reader");
      updateFileNameDisplay();
      resolveHtmlFile();
      registerRecentFromMd();
      initMdAgentPanel();
      initMdSmartToc();
      if(mdAgentApi&&mdAgentApi.reloadSession)mdAgentApi.reloadSession();
      requestAnimationFrame(function(){
        try{paintDocumentUi();}
        catch(e){
          statusEl.hidden=false;
          statusEl.textContent=e.message||String(e);
          statusEl.classList.add("err");
        }
      });
      setTimeout(function(){
        if(opts.upgradeApi)upgradeOutputFileFromApi(state.file);
        ensureMarksLoaded().finally(function(){
          if(state.panes.source)whenEditorLaidOut(function(){paintGutter();});
        });
        checkHtmlAvailable().finally(function(){
          if(state.panes.html)mountHtmlPane();
        });
      },80);
      if(params.get("_reg")==="1"){
        setTimeout(function(){
          applyPreset("split");
          whenEditorLaidOut(function(){
            var needle="中小公司";
            var start=state.text.indexOf(needle);
            if(start<0){needle="公司";start=state.text.indexOf(needle);}
            if(start<0){needle="## 分析信息";start=state.text.indexOf(needle);}
            if(start<0)return;
            var end=start+needle.length;
            state.marks=[{start:start,end:end,name:needle.replace(/\s+/g," ").trim()}];
            editor.setSelectionRange(start,end);
            lastSelection={start:start,end:end};
            scrollToOffset(start);
            paintMarks();
            updateSelectionStatus();
          });
        },600);
      }
    }
    fileName=safeDecodeFilename(fileName);
    if(!fileName){statusEl.textContent="缺少 file 参数";statusEl.classList.add("err");return;}
    state.file=fileName;
    updateFileNameDisplay();
    var docLoadPromise=fetchOutputFileFromDisk(fileName);
    loadFontPrefs();
    applyFontSizes();
    initSplitResizer();
    document.getElementById("renderFsDown").onclick=function(){bumpFont("render",-1);};
    document.getElementById("renderFsUp").onclick=function(){bumpFont("render",1);};
    document.getElementById("editorFsDown").onclick=function(){bumpFont("editor",-1);};
    document.getElementById("editorFsUp").onclick=function(){bumpFont("editor",1);};

    document.getElementById("copyPathBtn").onclick=function(){
      var p=state.absPath||state.file;
      navigator.clipboard.writeText(p).then(function(){toast("路径已复制");}).catch(function(){alert(p);});
    };
    document.getElementById("openLocalBtn").onclick=function(){
      if(!state.absPath){toast("路径不可用");return;}
      fetch("/api/output/open-local",{method:"POST",headers:authHeaders(),body:JSON.stringify({path:state.absPath,action:"file"})})
        .then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.detail||r.statusText);toast("已用本机程序打开");});})
        .catch(function(e){toast("打开失败："+(e.message||e));});
    };
    saveBtn.onclick=function(){saveFile(false);};
    saveAsBtn.onclick=function(){saveFile(true);};
    document.getElementById("markSelBtn").onmousedown=function(ev){
      ev.preventDefault();
      rememberSelection();
    };
    document.getElementById("markSelBtn").onclick=function(){toggleMarkSelection();};
    document.getElementById("prevMarkBtn").onclick=function(){gotoMark(-1);};
    document.getElementById("nextMarkBtn").onclick=function(){gotoMark(1);};
    if(panePicks){
      panePicks.querySelectorAll("input[data-pane]").forEach(function(inp){
        inp.onchange=function(){
          var k=inp.getAttribute("data-pane");
          state.panes[k]=!!inp.checked;
          if(paneCount()<1){
            state.panes[k]=true;
            inp.checked=true;
            toast("至少保留一栏");
            return;
          }
          state.preset="custom";
          setModeFromPanes();
        };
      });
    }
    gutter.onclick=function(){};
    if(markFloatToggle){
      markFloatToggle.onclick=function(ev){
        ev.stopPropagation();
        setMarkPanelCollapsed(!state.markPanelCollapsed);
      };
    }
    if(markFloatPanel){
      var markFloatHdr=markFloatPanel.querySelector(".md-mark-float-hdr");
      if(markFloatHdr){
        markFloatHdr.onclick=function(ev){
          if(ev.target.closest(".md-mark-float-toggle")||ev.target.closest(".md-mark-float-nav .md-btn"))return;
          setMarkPanelCollapsed(!state.markPanelCollapsed);
        };
      }
    }
    loadMarkPanelCollapsed();
    markListEl.onclick=function(ev){
      var chip=ev.target.closest(".md-mark-chip");
      if(!chip)return;
      var start=Number(chip.getAttribute("data-start"));
      var m=null;
      for(var i=0;i<state.marks.length;i++){if(state.marks[i].start===start){m=state.marks[i];break;}}
      if(!m)return;
      ensureEditModeForMarks().then(function(){
        editor.focus();
        editor.setSelectionRange(m.start,m.end);
        scrollToOffset(m.start);
        paintMarks();
      });
    };
    var composeBaseText=null;
    editor.addEventListener("compositionstart",function(){
      composeBaseText=state.text;
    });
    editor.addEventListener("compositionend",function(){
      if(composeBaseText==null)return;
      var oldText=composeBaseText;
      composeBaseText=null;
      applyEditorText(editor.value);
      if(oldText!==state.text){
        state.localRevision=(state.localRevision||0)+1;
        if(state.marks.length){
          state.marks=adjustMarksForTextEdit(oldText,state.text,state.marks);
          scheduleRemapMarks();
        }
        schedulePaintMarks();
        scheduleSplitPreview();
        updateDirty();
      }
    });
    editor.oninput=function(ev){
      if(ev&&ev.isComposing)return;
      var oldText=state.text;
      applyEditorText(editor.value);
      if(oldText===state.text)return;
      state.localRevision=(state.localRevision||0)+1;
      if(state.marks.length){
        state.marks=adjustMarksForTextEdit(oldText,state.text,state.marks);
        scheduleRemapMarks();
      }
      schedulePaintMarks();
      scheduleSplitPreview();
      updateDirty();
    };
    editor.onscroll=function(){
      syncEditorScroll();
    };
    window.addEventListener("resize",function(){if(state.mode!=="reader"){syncBackdropStyles();schedulePaintMarks();}});
    if(typeof ResizeObserver!=="undefined"){
      try{
        var editorResizeObs=new ResizeObserver(function(){
          if(state.mode==="reader")return;
          syncMeasureBox();
          syncBackdropStyles();
          schedulePaintMarks();
        });
        editorResizeObs.observe(editor);
      }catch(_){}
    }
    ["click","keyup","select","mouseup","mousedown"].forEach(function(ev){
      editor.addEventListener(ev,function(){
        if(ev.type==="mouseup"||ev.type==="keyup"||ev.type==="select")rememberSelection();
        if(ev.type==="mouseup"||ev.type==="keyup"){
          if(!currentSelection())clearStaleSelection();
        }
        updateSelectionStatus();
      });
    });
    function onMarkHotkey(ev){
      if(ev.ctrlKey&&ev.key.toLowerCase()==="s"){ev.preventDefault();saveFile(false);return;}
      if(ev.ctrlKey&&(ev.key.toLowerCase()==="q"||ev.code==="KeyQ")){
        ev.preventDefault();ev.stopPropagation();
        toggleMarkSelection({keyboard:true});
        return;
      }
      if(ev.key==="F2"&&!ev.ctrlKey&&!ev.altKey){ev.preventDefault();gotoMark(ev.shiftKey?-1:1);}
    }
    document.addEventListener("keydown",onMarkHotkey,true);
    editor.addEventListener("keydown",onMarkHotkey,true);
    document.addEventListener("visibilitychange",function(){
      if(document.visibilityState==="hidden"){
        flushMarksFooterBeforeLeave();
        return;
      }
      if(state.file)reloadFromLocalIfClean();
    });
    window.addEventListener("pagehide",flushMarksFooterBeforeLeave);
    window.onbeforeunload=function(ev){
      flushMarksFooterBeforeLeave();
      if(state.dirty){ev.preventDefault();ev.returnValue="";}
    };

    var loadWatchdog=setTimeout(function(){
      if(statusEl.hidden)return;
      statusEl.textContent="仍在加载…若长时间无响应请确认后端已启动并重试";
    },6000);
    docLoadPromise
      .then(function(d){
        applyLoadedDocument(d,fileName,{skipPaint:true});
        return ensureMarksLoaded();
      })
      .then(function(){
        try{
          afterDocumentLoaded({upgradeApi:false});
        }catch(e){
          statusEl.hidden=false;
          statusEl.textContent="加载失败："+(e.message||String(e));
          statusEl.classList.add("err");
        }
      })
      .catch(function(err){
        statusEl.hidden=false;
        statusEl.textContent="加载失败："+(err.message||String(err));
        statusEl.classList.add("err");
      })
      .finally(function(){clearTimeout(loadWatchdog);});
  })();
  </script>
</body>
</html>
