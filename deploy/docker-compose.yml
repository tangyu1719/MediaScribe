name: mediascribe

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先运行安装脚本生成 .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-superbizagent}
      MYSQL_USER: ${MYSQL_USER:-mediascribe}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先运行安装脚本生成 .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks: [mediascribe]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?请先运行安装脚本生成 .env}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请先运行安装脚本生成 .env}
    restart: unless-stopped
    networks: [mediascribe]

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - milvus_etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [mediascribe]

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: minio server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mediascribe}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请先运行安装脚本生成 .env}
    volumes:
      - milvus_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [mediascribe]

  milvus:
    image: milvusdb/milvus:v2.4.4
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-mediascribe}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?请先运行安装脚本生成 .env}
    ports:
      - "127.0.0.1:${MILVUS_PORT:-19530}:19530"
      - "127.0.0.1:${MILVUS_HEALTH_PORT:-9091}:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    networks: [mediascribe]

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    image: mediascribe-web:latest
    env_file:
      - path: ../.env
        required: true
    environment:
      SBA_AGENT_CONFIG: /app/runtime/agent/config.json
      SBA_CONFIG_YAML: /app/config.yaml
      SBA_DATABASE_URL: mysql+pymysql://${MYSQL_USER:-mediascribe}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-superbizagent}?charset=utf8mb4
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      KB_BACKEND: milvus
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - ../config.yaml:/app/config.yaml:ro
      - app_output:/app/output
      - app_runtime:/app/runtime/agent
      - model_cache:/app/src/agent/knowledge_base/models
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    restart: unless-stopped
    networks: [mediascribe]

volumes:
  mysql_data:
  redis_data:
  milvus_etcd:
  milvus_minio:
  milvus_data:
  app_output:
  app_runtime:
  model_cache:

networks:
  mediascribe:
    driver: bridge
